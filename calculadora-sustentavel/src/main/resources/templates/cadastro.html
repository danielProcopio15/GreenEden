<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GreenEden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #E63312, #ff8c5c); min-height: 100vh; padding: 20px; }
        .signup-container {
            background: white; border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,.2);
            padding: 48px; max-width: 520px; width: 100%; margin: 0 auto;
        }
        .signup-header { text-align: center; margin-bottom: 32px; }
        .signup-logo { height: 50px; margin-bottom: 12px; }
        .signup-title { font-size: 1.4rem; font-weight: 800; color: #E63312; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-weight: 600; color: #333; margin-bottom: 6px; display: block; }
        .form-control {
            border: 1px solid #ddd; border-radius: 8px;
            padding: 10px 14px; font-size: 0.95rem; width: 100%;
        }
        .form-control:focus { border-color: #E63312; box-shadow: 0 0 0 3px rgba(230,51,18,.1); outline: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-row.full { grid-template-columns: 1fr; }

        /* Campo de senha com olho */
        .password-wrapper { position: relative; }
        .password-wrapper .form-control { padding-right: 44px; }
        .toggle-senha {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: #888; font-size: 1rem; padding: 0;
            transition: color .2s;
        }
        .toggle-senha:hover { color: #E63312; }

        .btn-signup {
            background: #E63312; color: white; border: none;
            border-radius: 8px; padding: 12px; font-weight: 600;
            width: 100%; cursor: pointer; transition: background .2s;
            margin-top: 8px; font-size: 1rem;
        }
        .btn-signup:hover { background: #C0280F; }
        .btn-voltar {
            display: block; text-align: center;
            margin-top: 12px; padding: 10px;
            border: 1.5px solid #ddd; border-radius: 8px;
            color: #666; text-decoration: none; font-size: .9rem;
            transition: border-color .2s, color .2s;
        }
        .btn-voltar:hover { border-color: #E63312; color: #E63312; }
        .alert { border-radius: 8px; margin-bottom: 16px; }
        .link-group { text-align: center; margin-top: 20px; font-size: 0.95rem; }
        .link-group a { color: #E63312; text-decoration: none; font-weight: 600; }
        .hint { font-size: .78rem; color: #999; margin-top: 4px; }

        /* Indicador de força da senha */
        .senha-forca { display: flex; gap: 4px; margin-top: 6px; }
        .forca-bar {
            height: 4px; flex: 1; border-radius: 2px;
            background: #eee; transition: background .3s;
        }
        .forca-label { font-size: .75rem; color: #888; margin-top: 3px; }
    </style>
</head>
<body>

<div class="signup-container">
    <div class="signup-header">
        <img src="/logo.png" alt="GreenEden" class="signup-logo">
        <div class="signup-title">Criar Conta</div>
        <small style="color: #666;">GreenEden - Impacto Ambiental</small>
    </div>

    <div th:if="${erro}" class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${erro}"></span>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${sucesso}"></span>
    </div>

    <form method="POST" action="/auth/cadastro" id="formCadastro">

        <div class="form-row">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user me-1"></i>Nome *</label>
                <input type="text" class="form-control" name="nome"
                       th:value="${nome}" required placeholder="Seu nome completo">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-envelope me-1"></i>Email *</label>
                <!-- Email vem pré-preenchido quando vem do modal -->
                <input type="email" class="form-control" name="email"
                       th:value="${param.email}" required placeholder="seu@email.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-building me-1"></i>Empresa</label>
                <input type="text" class="form-control" name="empresa"
                       th:value="${empresa}" placeholder="Nome da empresa">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-id-card me-1"></i>CNPJ</label>
                <input type="text" class="form-control" name="cnpj"
                       id="cnpjInput" placeholder="00.000.000/0000-00" maxlength="18">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-phone me-1"></i>Telefone</label>
                <input type="tel" class="form-control" name="telefone"
                       id="telefoneInput" placeholder="(11) 9 0000-0000" maxlength="16">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-briefcase me-1"></i>Cargo</label>
                <input type="text" class="form-control" name="cargo" placeholder="Seu cargo">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock me-1"></i>Senha *</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" name="senha"
                           id="senhaInput" required minlength="8"
                           placeholder="Mín. 8 caracteres">
                    <button type="button" class="toggle-senha" onclick="toggleSenha('senhaInput', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="senha-forca">
                    <div class="forca-bar" id="bar1"></div>
                    <div class="forca-bar" id="bar2"></div>
                    <div class="forca-bar" id="bar3"></div>
                    <div class="forca-bar" id="bar4"></div>
                </div>
                <div class="forca-label" id="forcaLabel"></div>
                <div class="hint">Maiúsculas, minúsculas, números e caracteres especiais (!@#$%^&*)</div>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock me-1"></i>Confirmar Senha *</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" name="senhaConfirm"
                           id="senhaConfirmInput" required minlength="8"
                           placeholder="Repita a senha">
                    <button type="button" class="toggle-senha" onclick="toggleSenha('senhaConfirmInput', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="hint" id="senhaMatch" style="margin-top: 6px;"></div>
            </div>
        </div>

        <button type="submit" class="btn-signup">
            <i class="fas fa-user-plus me-2"></i>Criar Conta
        </button>

    </form>

    <a href="/" class="btn-voltar">
        <i class="fas fa-home me-1"></i> Voltar ao Início
    </a>

    <div class="link-group">
        Já tem conta? <a href="/auth/login">Faça login</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Mostrar/ocultar senha
function toggleSenha(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

// Indicador de força da senha
document.getElementById('senhaInput').addEventListener('input', function () {
    const senha = this.value;
    let forca = 0;
    if (senha.length >= 8) forca++;
    if (/[A-Z]/.test(senha)) forca++;
    if (/[0-9]/.test(senha)) forca++;
    if (/[!@#$%^&*]/.test(senha)) forca++;

    const cores = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71'];
    const labels = ['Fraca', 'Razoável', 'Boa', 'Forte'];
    const bars = [document.getElementById('bar1'), document.getElementById('bar2'),
                  document.getElementById('bar3'), document.getElementById('bar4')];

    bars.forEach((bar, i) => {
        bar.style.background = i < forca ? cores[forca - 1] : '#eee';
    });

    document.getElementById('forcaLabel').textContent = forca > 0 ? labels[forca - 1] : '';
    document.getElementById('forcaLabel').style.color = forca > 0 ? cores[forca - 1] : '#888';
});

// Verificar se senhas coincidem em tempo real
document.getElementById('senhaConfirmInput').addEventListener('input', function () {
    const senha = document.getElementById('senhaInput').value;
    const label = document.getElementById('senhaMatch');
    if (this.value === '') {
        label.textContent = '';
    } else if (this.value === senha) {
        label.textContent = '✓ Senhas coincidem';
        label.style.color = '#2ecc71';
    } else {
        label.textContent = '✗ Senhas não coincidem';
        label.style.color = '#e74c3c';
    }
});

// Validação antes de enviar
document.getElementById('formCadastro').addEventListener('submit', function (e) {
    const senha = document.getElementById('senhaInput').value;
    const confirm = document.getElementById('senhaConfirmInput').value;
    if (senha !== confirm) {
        e.preventDefault();
        alert('As senhas não coincidem. Verifique e tente novamente.');
        document.getElementById('senhaConfirmInput').focus();
    }
});

// Máscara CNPJ
document.getElementById('cnpjInput').addEventListener('input', function () {
    let v = this.value.replace(/\D/g, '').slice(0, 14);
    if (v.length > 12) v = v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8,12)+'-'+v.slice(12);
    else if (v.length > 8) v = v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8);
    else if (v.length > 5) v = v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5);
    else if (v.length > 2) v = v.slice(0,2)+'.'+v.slice(2);
    this.value = v;
});

// Máscara telefone
document.getElementById('telefoneInput').addEventListener('input', function () {
    let v = this.value.replace(/\D/g, '').slice(0, 11);
    if (v.length > 10) v = '('+v.slice(0,2)+') '+v.slice(2,3)+' '+v.slice(3,7)+'-'+v.slice(7);
    else if (v.length > 6) v = '('+v.slice(0,2)+') '+v.slice(2,6)+'-'+v.slice(6);
    else if (v.length > 2) v = '('+v.slice(0,2)+') '+v.slice(2);
    else if (v.length > 0) v = '('+v;
    this.value = v;
});
</script>
</body>
</html>
