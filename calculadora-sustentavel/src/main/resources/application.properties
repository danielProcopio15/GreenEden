spring.application.name=calculadora-sustentavel

# ─── Database (H2) ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./greenedendb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Colocar update em vez de create aqui
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Server ────────────────────────────────────────────────────────────────
server.port=8080

# ─── Geolocalização ─────────────────────────────────────────────────────────
# Geocodificação: Nominatim/OpenStreetMap (gratuito, sem cadastro)
# Roteamento:    OSRM public API (gratuito, sem cadastro)
# Nenhuma chave de API é necessária.
