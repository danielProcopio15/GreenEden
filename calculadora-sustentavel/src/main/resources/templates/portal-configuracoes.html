<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - GreenEden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff5f4; font-family: 'Segoe UI', sans-serif; }
        .header-portal { background: #E63312; color: white; padding: 14px 0; }
        .portal-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
        .portal-logo img { height: 40px; }
        .sidebar-portal { background: white; border-right: 1px solid #ffe0d9; padding: 24px 0; }
        .sidebar-item { padding: 12px 24px; border-left: 3px solid transparent; color: #666; text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .sidebar-item.active { background: #fff5f4; color: #E63312; border-left-color: #E63312; font-weight: 700; }
        .main-portal { padding: 32px; }
        .card-config { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .form-group { margin-bottom: 16px; }
        .form-label { font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-control { border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
        .form-control:focus { border-color: #E63312; box-shadow: 0 0 0 3px rgba(230, 51, 18, 0.1); }
        .btn-save { background: #E63312; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-weight: 600; }
        .btn-save:hover { background: #C0280F; }
        .alert { border-radius: 8px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-row.full { grid-template-columns: 1fr; }
        @media (max-width: 576px) {
            .user-greeting { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<header class="header-portal">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <a href="/portal" class="portal-logo">
            <img src="/logo.png" alt="GreenEden">
            <span style="font-weight: 800;"><span style="color: #ffe0a0;">Green</span>Eden</span>
        </a>
        <div style="display: flex; gap: 16px; align-items: center;">
            <div class="user-greeting" style="font-size: 0.95rem;">Olá, <strong th:text="${usuarioNome}"></strong>!</div>
            <a href="/auth/logout" style="background: rgba(255,255,255,.2); color: white; padding: 6px 16px; border-radius: 20px; text-decoration: none; font-size: 0.85rem;"><i class="fas fa-sign-out-alt me-1"></i>Sair</a>
        </div>
    </div>
</header>

<div class="d-flex">
    <div class="sidebar-portal" style="width: 220px; min-height: calc(100vh - 60px);">
        <div style="display: flex; flex-direction: column;">
            <a href="/portal" class="sidebar-item"><i class="fas fa-chart-line"></i>Dashboard</a>
            <a href="/portal/pedidos" class="sidebar-item"><i class="fas fa-shopping-cart"></i>Pedidos</a>
            <a href="/portal/configuracoes" class="sidebar-item active"><i class="fas fa-cog"></i>Configurações</a>
        </div>
    </div>

    <div class="main-portal" style="flex: 1;">
        <h2 class="mb-4"><i class="fas fa-cog me-2" style="color: #E63312;"></i>Configurações da Conta</h2>

        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${sucesso}"></span>
        </div>

        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${erro}"></span>
        </div>

        <!-- Dados Pessoais -->
        <div class="card-config">
            <h5 class="fw-700 mb-3"><i class="fas fa-user me-2"></i>Dados Pessoais</h5>
            <form method="POST" action="/portal/configuracoes">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" name="nome" th:value="${usuario?.nome ?: ''}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Cargo</label>
                        <input type="text" class="form-control" name="cargo" th:value="${usuario?.cargo ?: ''}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Empresa</label>
                        <input type="text" class="form-control" name="empresa" th:value="${usuario?.empresa ?: ''}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">CNPJ</label>
                        <input type="text" class="form-control" name="cnpj" th:value="${usuario?.cnpj ?: ''}" placeholder="00.000.000/0000-00">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label class="form-label">Telefone</label>
                        <input type="tel" class="form-control" name="telefone" th:value="${usuario?.telefone ?: ''}" placeholder="(11) 99999-9999">
                    </div>
                </div>
                <button type="submit" class="btn btn-save"><i class="fas fa-save me-2"></i>Salvar Alterações</button>
            </form>
        </div>

        <!-- Alterar Senha -->
        <div class="card-config">
            <h5 class="fw-700 mb-3"><i class="fas fa-lock me-2"></i>Alterar Senha</h5>
            <form method="POST" action="/portal/alterar-senha">
                <div class="form-row full">
                    <div class="form-group">
                        <label class="form-label">Senha Atual</label>
                        <input type="password" class="form-control" name="senhaAnterior" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Nova Senha</label>
                        <input type="password" class="form-control" name="novaSenha" required minlength="6" placeholder="Mín. 6 caracteres">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirmar Senha</label>
                        <input type="password" class="form-control" name="novasSenhaConfirm" required minlength="6" placeholder="Confirme">
                    </div>
                </div>
                <button type="submit" class="btn btn-save"><i class="fas fa-key me-2"></i>Atualizar Senha</button>
            </form>
        </div>

        <!-- Informações da Conta -->
        <div th:if="${usuario != null}" class="card-config">
            <h5 class="fw-700 mb-3"><i class="fas fa-info-circle me-2"></i>Informações da Conta</h5>
            <p><strong>Email:</strong> <span th:text="${usuario?.email ?: 'N/D'}"></span></p>
            <p><strong>Membro desde:</strong> <span th:text="${usuario?.criadoEm?.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy'))}"></span></p>
            <a href="/auth/logout" class="btn btn-outline-danger"><i class="fas fa-sign-out-alt me-2"></i>Sair da Conta</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
