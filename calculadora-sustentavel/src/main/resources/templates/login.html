<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GreenEden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #E63312, #ff8c5c); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .login-container { 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0,0,0,.2); 
            padding: 48px; 
            max-width: 400px; 
            width: 100%; 
            margin: auto;
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-logo { height: 60px; margin-bottom: 16px; }
        .login-title { font-size: 1.5rem; font-weight: 800; color: #E63312; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-control { border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; font-size: 0.95rem; }
        .form-control:focus { border-color: #E63312; box-shadow: 0 0 0 3px rgba(230, 51, 18, 0.1); }
        .btn-login { background: #E63312; color: white; border: none; border-radius: 8px; padding: 10px; font-weight: 600; width: 100%; margin-top: 8px; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background: #C0280F; }
        .alert { border-radius: 8px; margin-bottom: 16px; }
        .link-group { text-align: center; margin-top: 20px; font-size: 0.95rem; }
        .link-group a { color: #E63312; text-decoration: none; font-weight: 600; }
        .link-group a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <img src="/logo.png" alt="GreenEden" class="login-logo">
        <div class="login-title">GreenEden</div>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${erro}"></span>
    </div>

    <form method="POST" action="/auth/login">
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" name="senha" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-login"><i class="fas fa-sign-in-alt me-2"></i>Entrar</button>
    </form>

    <div class="link-group">
        Não tem conta? <a href="/auth/cadastro">Crie uma agora</a>
    </div>

    <div class="link-group" style="margin-top: 16px; font-size: 0.85rem; color: #666;">
        <a href="/" style="color: #666;">Voltar para Início</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
